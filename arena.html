<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Hologram Arena</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
  <!-- targets.mind is compiled from cover_arena_target.png (MindAR compiler) -->
  <a-scene mindar-image="imageTargetSrc: assets/targets/targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets>
      <a-asset-item id="dragonModel" src="assets/glb/model_20.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model src="#dragonModel" position="0 0 0.1" scale="0.5 0.5 0.5" rotation="90 0 0" animation-mixer></a-gltf-model>
    </a-entity>
  </a-scene>
</body>
</html>
