<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Hologram Arena</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script>
    // Which hologram to show: ?id=01..52, or the book's diorama pages (?zone=carrier|dragon).
    const params = new URLSearchParams(window.location.search);
    const ZONES = { carrier: '01', dragon: '05' };
    const MODEL_ID = params.get('id') || ZONES[params.get('zone')] || '18';

  </script>
  <style>
    /* same control pad as the 3D view: arrows turn, middle resets, + and - in the bottom corners resize */
    .pad { --k: 56px; position: fixed; right: 12px; top: 50%; transform: translateY(-50%); display: grid;
           grid-template-columns: repeat(3, var(--k)); grid-template-rows: repeat(3, var(--k)); gap: 4px; z-index: 12; }
    .ctl { width: var(--k); height: var(--k); border: none; border-radius: 14px; background: rgba(15, 23, 42, 0.85); color: #fff;
           font-size: 20px; touch-action: none; user-select: none; -webkit-user-select: none; }
    .ctl:active { background: #2563eb; }
    .pad .up { grid-column: 2; grid-row: 1; }
    .pad .left { grid-column: 1; grid-row: 2; }
    .pad .mid { grid-column: 2; grid-row: 2; }
    .pad .right { grid-column: 3; grid-row: 2; }
    .pad .down { grid-column: 2; grid-row: 3; }
    .pad .plus { grid-column: 1; grid-row: 3; font-size: 28px; font-weight: 700; }
    .pad .minus { grid-column: 3; grid-row: 3; font-size: 28px; font-weight: 700; }
    .hint { position: fixed; left: 0; right: 0; bottom: 16px; text-align: center; font-family: system-ui, sans-serif;
            color: #fff; text-shadow: 0 1px 3px #000; font-size: 15px; z-index: 10; padding: 0 16px; }
    .back { position: fixed; top: 12px; left: 12px; z-index: 10; background: rgba(15, 23, 42, 0.8); color: #fff;
            padding: 8px 14px; border-radius: 18px; font-family: system-ui, sans-serif; text-decoration: none; font-weight: 600; }
    .chrome { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 11; background: #10b981; color: #fff;
              border: none; padding: 16px 24px; border-radius: 24px; font-size: 17px; font-weight: 700; }
  </style>
</head>
<body style="margin:0; overflow:hidden;">
  <div class="hint" id="hint">Point your camera at the AR arena page or the back cover.</div>
  <!-- model controls: turn left/right, tilt up/down, size, reset -->
  <div class="pad">
    <button class="ctl up" data-act="up" aria-label="Tilt up">&#9650;</button>
    <button class="ctl left" data-act="left" aria-label="Turn left">&#9664;</button>
    <button class="ctl mid" data-act="reset" aria-label="Reset">&#10227;</button>
    <button class="ctl right" data-act="right" aria-label="Turn right">&#9654;</button>
    <button class="ctl down" data-act="down" aria-label="Tilt down">&#9660;</button>
    <button class="ctl plus" data-act="bigger" aria-label="Bigger">+</button>
    <button class="ctl minus" data-act="smaller" aria-label="Smaller">&minus;</button>
  </div>
  <a class="back" id="back" href="index.html">&larr; Back</a>
  <!-- Messenger / Facebook in-app browsers often block the camera: offer Chrome -->
  <button class="chrome" id="chrome-btn" hidden>Open in Chrome for AR</button>

  <!-- targets.mind is compiled from kdp_output/cover_arena_target.png (tools/mindar-node/compile.mjs) -->
  <a-scene mindar-image="imageTargetSrc: assets/targets/targets.mind; uiScanning: yes; uiLoading: yes"
           vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <!-- #spin turns around the page's normal and holds the size; #hologram stands the model up
           out of the page (and tilts). The target is 1 unit wide, a sheet 0.2 m: scale 3 = ~60%. -->
      <a-entity id="spin" position="0 0 0.05" scale="3 3 3">
        <a-entity id="hologram" rotation="90 0 0"></a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    // the static finished model (with paper thickness) made for AR
    document.getElementById('hologram').setAttribute('gltf-model', `assets/glb/ar/model_${MODEL_ID}.glb`);
    document.getElementById('back').href = `index.html?id=${MODEL_ID}`;

    // control buttons: turn, tilt, size (hold to repeat), reset
    const spin = document.getElementById('spin');
    const holo = document.getElementById('hologram');
    const STEP = Math.PI / 12;
    const ACTIONS = {
      left: () => { spin.object3D.rotation.z += STEP; },
      right: () => { spin.object3D.rotation.z -= STEP; },
      up: () => { holo.object3D.rotation.x = Math.min(Math.PI, holo.object3D.rotation.x + STEP); },
      down: () => { holo.object3D.rotation.x = Math.max(0, holo.object3D.rotation.x - STEP); },
      bigger: () => { spin.object3D.scale.multiplyScalar(1.15); },
      smaller: () => { spin.object3D.scale.multiplyScalar(1 / 1.15); },
      reset: () => {
        spin.object3D.rotation.set(0, 0, 0);
        spin.object3D.scale.set(3, 3, 3);
        holo.object3D.rotation.set(Math.PI / 2, 0, 0);
      },
    };
    document.querySelectorAll('.ctl[data-act]').forEach((btn) => {
      const act = ACTIONS[btn.dataset.act];
      let timer = null;
      const stop = () => { clearInterval(timer); timer = null; };
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        act();
        stop();
        if (btn.dataset.act !== 'reset') timer = setInterval(act, 120);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => btn.addEventListener(ev, stop));
    });

    if (/android/i.test(navigator.userAgent) && /; wv\)|FB_IAB|FBAN|FBAV|Instagram|Line\//.test(navigator.userAgent)) {
      const btn = document.getElementById('chrome-btn');
      btn.hidden = false;
      btn.onclick = () => {
        location.href = `intent://${location.host}${location.pathname}${location.search}`
          + '#Intent;scheme=https;package=com.android.chrome;end;';
      };
    }
  </script>
</body>
</html>
