<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Origami 3D Studio</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer@3.4.0/dist/model-viewer.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b0f19; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; line-height: 1.5; }
    header { background: #1e293b; padding: 14px 16px; border-bottom: 1px solid #334155; }
    header h1 { font-size: 18px; color: #38bdf8; }
    .badge { display: inline-block; background: #3b82f6; padding: 2px 10px; border-radius: 12px; font-size: 12px; margin-top: 6px; }
    model-viewer { width: 100%; flex: 1; min-height: 60vh; background: radial-gradient(circle, #1e293b 0%, #0b0f19 100%); }
    .pad { position: absolute; top: 12px; right: 12px; display: grid; grid-template-columns: repeat(3, 44px);
           grid-template-rows: repeat(3, 44px); gap: 4px; z-index: 5; }
    .pad-btn { width: 44px; height: 44px; border: none; border-radius: 12px; background: rgba(30, 41, 59, 0.85);
               color: #f8fafc; font-size: 18px; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
    .pad-btn:active { background: #2563eb; }
    .pad .up { grid-column: 2; grid-row: 1; }
    .pad .left { grid-column: 1; grid-row: 2; }
    .pad .mid { grid-column: 2; grid-row: 2; font-size: 20px; }
    .pad .right { grid-column: 3; grid-row: 2; }
    .pad .down { grid-column: 2; grid-row: 3; }
    .ar-row { position: absolute; bottom: 16px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; padding: 0 12px; flex-wrap: wrap; }
    .ar-pill { background: #10b981; color: #fff; border: none; padding: 12px 18px; border-radius: 24px; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; }
    .ar-pill.arena { background: #f59e0b; color: #0b0f19; }
    .hint-box { background: #0f172a; border-top: 1px solid #334155; padding: 14px 16px; font-size: 15px; color: #cbd5e1; min-height: 60px; }
    .controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; background: #1e293b; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 12px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn:disabled { background: #334155; opacity: 0.5; cursor: default; }
    #step-counter { font-weight: 700; min-width: 80px; text-align: center; }
    .ar-log { background: #422006; color: #fde68a; font-size: 13px; padding: 8px 16px; border-top: 1px solid #854d0e; }
    .phone-panel { position: fixed; inset: 0; background: rgba(11, 15, 25, 0.92); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
    .phone-panel.open { display: flex; }
    .phone-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; max-width: 340px; text-align: center; }
    .phone-card h2 { font-size: 18px; color: #38bdf8; margin-bottom: 8px; }
    .phone-card p { color: #cbd5e1; font-size: 14px; margin-bottom: 16px; }
    #phone-qr { background: #fff; padding: 12px; border-radius: 8px; display: inline-block; margin-bottom: 16px; max-width: 100%; }
    #phone-qr img, #phone-qr canvas { max-width: 100%; height: auto; }
    .footer-link { display: block; text-align: center; padding: 14px; background: #475569; color: #fff; text-decoration: none; font-weight: 600; }
    @media (min-width: 900px) { body { flex-direction: row; } model-viewer { min-height: 100vh; } }
  </style>
</head>
<body>
  <main style="display:flex; flex-direction:column; flex:1;">
    <header>
      <h1 id="model-title">Loading...</h1>
      <span id="model-level" class="badge"></span>
    </header>

    <!-- explicit camera: every sheet is 20 cm and centered, and the auto-framing counts all fold shapes at once -->
    <model-viewer id="viewer" loading="eager" ar ar-modes="webxr scene-viewer quick-look" camera-controls touch-action="pan-y" shadow-intensity="1"
      camera-target="0m 0m 0m" camera-orbit="20deg 75deg 0.6m" field-of-view="30deg"
      min-camera-orbit="auto auto 0.25m" max-camera-orbit="auto auto 1.5m">
      <!-- our own button, not slot="ar-button": model-viewer's AR launch fails silently on some Android
           browsers. The empty slot keeps model-viewer from adding its own "View in your space" button. -->
      <span slot="ar-button" hidden></span>
      <!-- arrow pad: turn the model without dragging (hold to keep turning) -->
      <div class="pad" id="pad">
        <button class="pad-btn up" data-turn="0,-1" aria-label="Turn up">&#9650;</button>
        <button class="pad-btn left" data-turn="-1,0" aria-label="Turn left">&#9664;</button>
        <button class="pad-btn mid" id="pad-reset" aria-label="Reset view">&#10227;</button>
        <button class="pad-btn right" data-turn="1,0" aria-label="Turn right">&#9654;</button>
        <button class="pad-btn down" data-turn="0,1" aria-label="Turn down">&#9660;</button>
      </div>
      <div class="ar-row">
        <button id="ar-btn" class="ar-pill" type="button">AR in your room</button>
        <!-- the model sits on the printed arena page and follows it, so it can't wander off -->
        <a id="arena-btn" class="ar-pill arena" href="arena.html">AR on the book page</a>
      </div>
    </model-viewer>

    <div class="hint-box" id="step-hint"></div>
    <div class="ar-log" id="ar-log" hidden></div>

    <div class="controls">
      <button class="btn" id="prev-btn">Back</button>
      <span id="step-counter">1 / 1</span>
      <button class="btn" id="replay-btn" title="Play this step again">&#x21bb; Replay</button>
      <button class="btn" id="next-btn">Next</button>
    </div>

    <a href="vault.html" class="footer-link">Backup Vault</a>
  </main>

  <!-- WebXR AR uses its own hidden viewer holding the static finished model (assets/glb/ar/):
       posing the animated model on its last frame before AR did not stick -->
  <!-- scale 2.5: a real 20 cm paper model was too small to keep in view in the room -->
  <model-viewer id="ar-viewer" loading="eager" ar ar-modes="webxr" ar-scale="auto" scale="2.5 2.5 2.5" aria-hidden="true"
    style="position:absolute; left:-10px; top:0; width:1px; height:1px; opacity:0; pointer-events:none;">
    <span slot="ar-button" hidden></span>
  </model-viewer>

  <!-- AR needs a phone camera: on a computer the AR button shows this instead -->
  <div class="phone-panel" id="phone-panel">
    <div class="phone-card">
      <h2>AR works on your phone</h2>
      <p>Scan this code with your phone's camera to open this model there, then tap AR.</p>
      <div id="phone-qr"></div>
      <div><button class="btn" id="phone-close">Close</button></div>
    </div>
  </div>

  <script>
    const viewer = document.getElementById('viewer');
    const arViewer = document.getElementById('ar-viewer');
    const params = new URLSearchParams(window.location.search);
    const modelId = params.get('id') || '01';
    let modelData = null;
    let currentStep = 1;
    // clips are 1 s per step; 0.25 plays each fold over about 4 s so a kid can follow it
    viewer.timeScale = 0.25;

    fetch('models.json')
      .then(res => res.json())
      .then(data => {
        modelData = data[modelId] || data['01'];
        document.getElementById('model-title').innerText = modelData.title;
        document.getElementById('model-level').innerText = `${modelData.difficulty} (${modelData.steps} steps)`;
        viewer.src = `assets/glb/model_${modelId}.glb`;
        viewer.iosSrc = `assets/usdz/model_${modelId}.usdz`;
        arViewer.src = `assets/glb/ar/model_${modelId}.glb`;
        document.getElementById('arena-btn').href = `arena.html?id=${modelId}`;
        updateUI();
        showArMessage();
      })
      .catch((err) => {
        console.error(err);
        document.getElementById('step-hint').innerText = 'models.json could not be loaded.';
      });

    function step(dir) {
      if (!modelData) return;
      currentStep = Math.max(1, Math.min(modelData.steps, currentStep + dir));
      updateUI();
    }

    function updateUI() {
      document.getElementById('step-counter').innerText = `${currentStep} / ${modelData.steps}`;
      document.getElementById('step-hint').innerText = modelData.stepHints[currentStep - 1] || '';
      document.getElementById('prev-btn').disabled = currentStep === 1;
      document.getElementById('next-btn').disabled = currentStep === modelData.steps;
      playStep();
    }

    // animation clip per step: Step_01, Step_02, ... (no clip until the GLB exists)
    function playStep() {
      try {
        viewer.animationName = `Step_${String(currentStep).padStart(2, '0')}`;
        viewer.currentTime = 0;
        viewer.play({ repetitions: 1 });
      } catch (err) {
        console.warn('Animation not ready:', err);
      }
    }

    // when a step's clip ends, model-viewer rewinds it; hold the folded result instead
    viewer.addEventListener('finished', () => {
      viewer.pause();
      viewer.currentTime = Math.max(0, viewer.duration - 0.001);
    });

    // AR: Android goes straight to Google Scene Viewer with the finished model (assets/glb/ar/),
    // iPhone uses Quick Look through model-viewer; any failure is shown instead of doing nothing.
    const isAndroid = /android/i.test(navigator.userAgent);
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);  // iPadOS reports a Mac
    const hint = (text) => { document.getElementById('step-hint').innerText = text; };

    // Android tries, in order: WebXR inside the browser (needs only ARCore), then Google Scene
    // Viewer through the Google app, then Scene Viewer inside ARCore. A Scene Viewer launch that
    // fails reloads this page with ?ar=<next stage>; each tap of AR tries the current stage.
    const AR_STAGES = ['webxr', 'google', 'core', 'none'];
    const AR_APPS = {
      google: { pkg: 'com.google.android.googlequicksearchbox', mode: 'ar_preferred' },
      core: { pkg: 'com.google.ar.core', mode: 'ar_only' },
    };
    let arStage = AR_STAGES.includes(params.get('ar')) ? params.get('ar') : 'webxr';
    const nextStage = (s) => AR_STAGES[Math.min(AR_STAGES.indexOf(s) + 1, AR_STAGES.length - 1)];

    // visible AR log: what was tried and what happened, kept across the fallback reloads
    const arLog = document.getElementById('ar-log');
    let arLines = [];
    try {
      // a fresh visit (no ?ar=) starts a fresh log
      if (params.get('ar')) arLines = JSON.parse(sessionStorage.getItem('arLog') || '[]');
      else sessionStorage.removeItem('arLog');
    } catch (e) { /* storage off */ }
    function logAR(line) {
      arLines = arLines.concat(line).slice(-6);
      try { sessionStorage.setItem('arLog', JSON.stringify(arLines)); } catch (e) { /* storage off */ }
      arLog.innerText = 'AR: ' + arLines.join(' → ');
      arLog.hidden = false;
    }
    if (params.get('ar')) logAR(`came back (stage ${arStage})`);
    const AR_MESSAGES = {
      google: 'Tap AR again to try the Google AR viewer.',
      core: 'Tap AR again to try Google Play Services for AR.',
      none: 'AR on Android needs Google Play Services for AR (and the Google app). Install or update them from Google Play, then try again.',
    };
    // shown after models.json loads, which would otherwise overwrite it with the step hint
    const showArMessage = () => { if (params.get('ar') && AR_MESSAGES[arStage]) hint(AR_MESSAGES[arStage]); };

    async function webxrSupported() {
      try {
        return !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar'));
      } catch (e) {
        return false;
      }
    }

    function launchSceneViewer(stage) {
      const app = AR_APPS[stage];
      const glb = new URL(`assets/glb/ar/model_${modelId}.glb`, location.href).href;
      const back = new URL(location.href);
      back.searchParams.set('ar', nextStage(stage));
      const title = modelData ? modelData.title : 'AR Origami';
      logAR(`opening Scene Viewer (${stage === 'google' ? 'Google app' : 'ARCore'})`);
      location.href = 'intent://arvr.google.com/scene-viewer/1.0'
        + `?file=${encodeURIComponent(glb)}&mode=${app.mode}&title=${encodeURIComponent(title)}`
        + `#Intent;scheme=https;package=${app.pkg};`
        + 'action=android.intent.action.VIEW;'
        + `S.browser_fallback_url=${encodeURIComponent(back.href)};end;`;
    }

    // Messenger / Facebook / Instagram open links in their own WebView, which has no WebXR,
    // and QR scans from those apps are common; AR there means reopening the page in Chrome.
    const inAppBrowser = /; wv\)|FB_IAB|FBAN|FBAV|Instagram|Line\//.test(navigator.userAgent);

    function openInChrome() {
      const url = new URL(location.href);
      url.searchParams.delete('ar');
      logAR('in-app browser: reopening in Chrome');
      hint('AR does not run inside Messenger or Facebook. Opening this page in Chrome...');
      location.href = `intent://${url.host}${url.pathname}${url.search}`
        + '#Intent;scheme=https;package=com.android.chrome;'
        + `S.browser_fallback_url=${encodeURIComponent(url.href)};end;`;
    }

    document.getElementById('ar-btn').addEventListener('click', async () => {
      if (isAndroid && inAppBrowser) {
        openInChrome();
        return;
      }
      if (isAndroid) {
        if (arStage === 'webxr') {
          const ok = await webxrSupported();
          logAR(`WebXR ${ok ? 'yes' : 'no'}`);
          if (ok) {
            hint('Point the camera at the floor and move the phone slowly until the model appears. '
              + 'Drag with one finger to move it, twist with two fingers to turn it, pinch to resize. '
              + 'Lost it? Leave AR and tap AR again. Easier: use "AR on the book page".');
            arViewer.activateAR();
            return;
          }
          arStage = 'google';
        }
        if (arStage === 'none') {
          logAR('nothing left to try');
          hint(AR_MESSAGES.none);
          return;
        }
        launchSceneViewer(arStage);
      } else if (!isIOS) {
        openPhonePanel();  // a computer: AR needs a phone camera, whatever the browser
      } else if (viewer.canActivateAR) {
        viewer.activateAR();
      } else {
        hint('AR is not available in this browser. On iPhone open this page in Safari.');
      }
    });

    function openPhonePanel() {
      const box = document.getElementById('phone-qr');
      if (!box.hasChildNodes() && window.QRCode) {
        const url = new URL(location.href);
        url.searchParams.delete('ar');
        new QRCode(box, { text: url.href, width: 200, height: 200 });
      }
      document.getElementById('phone-panel').classList.add('open');
    }
    document.getElementById('phone-close').addEventListener('click',
      () => document.getElementById('phone-panel').classList.remove('open'));

    // WebXR status comes from the AR viewer (Android) or the main viewer (iPhone Quick Look)
    let webxrWorked = false;
    function onArStatus(e) {
      const status = e.detail.status;
      if (isAndroid) logAR(`WebXR ${status}`);
      if (status === 'session-started') webxrWorked = true;
      if (status !== 'failed') return;
      if (!isAndroid) {
        hint('AR could not start on this device. On iPhone use Safari.');
      } else if (webxrWorked) {
        // WebXR ran before on this page (a failure after leaving AR); keep using it
        hint('Tap AR to start again.');
      } else {
        arStage = 'google';  // WebXR never started: the next tap uses Scene Viewer
        hint(AR_MESSAGES.google);
      }
    }
    viewer.addEventListener('ar-status', onArStatus);
    arViewer.addEventListener('ar-status', onArStatus);

    // arrow pad: each tick turns the camera 15 degrees; holding a button keeps turning
    const START_ORBIT = viewer.getAttribute('camera-orbit');
    // turn from the goal, not from the camera's current position: it glides toward the goal,
    // so stepping from where it is made held buttons slow and uneven
    let goal = null;
    function turn(dx, dy) {
      if (!goal) {
        const o = viewer.getCameraOrbit();
        goal = { theta: o.theta, phi: o.phi, radius: o.radius };
      }
      const step = Math.PI / 12;
      goal.theta += dx * step;
      goal.phi = Math.min(Math.PI - 0.15, Math.max(0.15, goal.phi + dy * step));
      viewer.cameraOrbit = `${goal.theta}rad ${goal.phi}rad ${goal.radius}m`;
    }
    viewer.addEventListener('camera-change', (e) => {
      if (e.detail.source === 'user-interaction') goal = null;  // a finger drag takes over
    });
    document.querySelectorAll('.pad-btn[data-turn]').forEach((btn) => {
      const [dx, dy] = btn.dataset.turn.split(',').map(Number);
      let timer = null;
      const stop = () => { clearInterval(timer); timer = null; };
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        turn(dx, dy);
        stop();
        timer = setInterval(() => turn(dx, dy), 120);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => btn.addEventListener(ev, stop));
    });
    document.getElementById('pad-reset').addEventListener('click', () => {
      goal = null;
      viewer.cameraOrbit = START_ORBIT;
      viewer.fieldOfView = '30deg';
    });

    document.getElementById('prev-btn').addEventListener('click', () => step(-1));
    document.getElementById('next-btn').addEventListener('click', () => step(1));
    document.getElementById('replay-btn').addEventListener('click', () => { if (modelData) playStep(); });
  </script>
</body>
</html>
